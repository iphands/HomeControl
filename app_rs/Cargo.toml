[package]
name = "homectrl"
version = "0.1.0"
edition = "2021"
authors = ["HomeCtrl Contributors"]
description = "LED strip controller with HTTP API and animation modes"
license = "MIT"
rust-version = "1.70"

[dependencies]
actix-web = { version = "4", features = ["macros"] }
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
thiserror = "1"
rand = { version = "0.8", features = ["small_rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
