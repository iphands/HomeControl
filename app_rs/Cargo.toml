[package]
name = "homectrl"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "sync"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
