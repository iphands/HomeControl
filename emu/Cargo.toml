[package]
name = "led-strip-emulator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "led-strip-emulator"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", features = ["wgpu", "default_fonts"] }
egui = "0.28"
egui-wgpu = "0.28"
wgpu = "0.20"
winit = "0.29"
pollster = "0.3"
tokio = { version = "1.0", features = ["full"] }
socket2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"